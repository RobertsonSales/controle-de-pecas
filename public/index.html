<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque - Peças de Análises Clínicas</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-600 rounded-lg text-white">
          <i class="ph ph-first-aid-kit text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">Estoque de Peças & Insumos</h1>
          <p class="text-xs text-slate-400">Análises Clínicas & Diagnostic Devices</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchData()" class="flex items-center gap-2 px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition">
          <i class="ph ph-arrows-clockwise text-base" id="refresh-icon"></i> Sincronizar
        </button>
        <button onclick="openModal()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 font-medium rounded-lg text-sm transition shadow-md">
          <i class="ph ph-plus-circle text-lg"></i> Nova Peça
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
    
    <!-- Barra de Filtros e Busca -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="relative">
        <i class="ph ph-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-lg"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Buscar por peça, função ou categoria..." 
               class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
      </div>
      <div>
        <select id="equipFilter" onchange="applyFilters()" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
          <option value="">Todos os Equipamentos</option>
        </select>
      </div>
      <div>
        <select id="prioFilter" onchange="applyFilters()" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
          <option value="">Todas as Prioridades</option>
          <option value="Alta">Alta Prioridade</option>
          <option value="Média">Média Prioridade</option>
          <option value="Baixa">Baixa Prioridade</option>
        </select>
      </div>
    </div>

    <!-- Indicador de Carregamento -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
      <i class="ph ph-spinner animate-spin text-4xl text-blue-500 mb-2"></i>
      <p class="text-sm">Carregando dados da planilha...</p>
    </div>

    <!-- Tabela de Peças -->
    <div id="tableContainer" class="hidden bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/60 text-slate-400 font-semibold border-b border-slate-700">
            <tr>
              <th class="p-4">Equipamento</th>
              <th class="p-4">Peça / Insumo</th>
              <th class="p-4">Categoria</th>
              <th class="p-4 text-center">Prioridade</th>
              <th class="p-4 text-center">Estoque Atual</th>
              <th class="p-4 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="inventoryBody" class="divide-y divide-slate-700/50">
            <!-- As linhas serão inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Inserir Nova Peça -->
  <div id="itemModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white">Cadastrar Nova Peça</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form id="addForm" onsubmit="handleAddItem(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Equipamento/Modalidade</label>
          <input type="text" id="newEquip" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Peça / Insumo Crítico</label>
          <input type="text" id="newPeca" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Categoria / Tipo</label>
            <input type="text" id="newCat" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Prioridade</label>
            <select id="newPrio" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
              <option value="Alta">Alta</option>
              <option value="Média">Média</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Função Principal</label>
          <textarea id="newFunc" rows="2" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Vida Útil / Prevalência</label>
            <input type="text" id="newPrev" placeholder="Ex: 6 a 12 meses" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Qtd Inicial</label>
            <input type="number" id="newQty" min="0" value="1" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold">Salvar Peça</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // A API_URL será injetada dinamicamente pelo servidor Node/Vercel ou lida de variável local
    let API_URL = ""; 
    let rawInventoryData = [];

    // Inicialização da aplicação
    async function init() {
      try {
        // Tenta buscar a variável de ambiente exposta pelo servidor
        const configRes = await fetch('/api/config');
        if (configRes.ok) {
          const config = await configRes.json();
          API_URL = config.apiUrl;
        }
      } catch (e) {
        console.warn("Ambiente local sem endpoint /api/config. Certifique-se de configurar a API_URL.");
      }
      fetchData();
    }

    // Busca dados no Google Sheets
    async function fetchData() {
      if (!API_URL) {
        alert("URL do Google Apps Script não configurada! Verifique a variável VERCEL_EXPOSE_SHEETS_URL.");
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tableContainer').classList.add('hidden');
      document.getElementById('refresh-icon').classList.add('animate-spin');

      try {
        const res = await fetch(API_URL);
        rawInventoryData = await res.json();
        populateEquipFilter();
        applyFilters();
      } catch (err) {
        alert("Erro ao carregar dados da planilha. Verifique as permissões da implantação do Apps Script.");
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('tableContainer').classList.remove('hidden');
        document.getElementById('refresh-icon').classList.remove('animate-spin');
      }
    }

    // Preenche o filtro com os equipamentos únicos
    function populateEquipFilter() {
      const select = document.getElementById('equipFilter');
      const uniqueEquips = [...new Set(rawInventoryData.map(i => i.equipamento))].sort();
      select.innerHTML = '<option value="">Todos os Equipamentos</option>';
      uniqueEquips.forEach(eq => {
        if(eq) select.innerHTML += `<option value="${eq}">${eq}</option>`;
      });
    }

    // Aplica os filtros de pesquisa
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const equip = document.getElementById('equipFilter').value;
      const prio = document.getElementById('prioFilter').value;

      const filtered = rawInventoryData.filter(item => {
        const matchSearch = item.peca.toLowerCase().includes(search) || 
                            item.funcao.toLowerCase().includes(search) || 
                            item.categoria.toLowerCase().includes(search);
        const matchEquip = !equip || item.equipamento === equip;
        const matchPrio = !prio || item.prioridade === prio;
        return matchSearch && matchEquip && matchPrio;
      });

      renderTable(filtered);
    }

    // Renderiza a tabela HTML
    function renderTable(items) {
      const tbody = document.getElementById('inventoryBody');
      tbody.innerHTML = "";

      if(items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Nenhum item encontrado.</td></tr>`;
        return;
      }

      items.forEach(item => {
        const prioBadge = item.prioridade === 'Alta' 
          ? 'bg-red-500/10 text-red-400 border-red-500/20' 
          : item.prioridade === 'Média' 
          ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' 
          : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-4 font-semibold text-white">${item.equipamento}</td>
            <td class="p-4">
              <div class="font-medium text-slate-200">${item.peca}</div>
              <div class="text-xs text-slate-400">${item.funcao}</div>
            </td>
            <td class="p-4 text-slate-400 text-xs">${item.categoria}</td>
            <td class="p-4 text-center">
              <span class="px-2.5 py-1 text-xs border rounded-full font-medium ${prioBadge}">${item.prioridade}</span>
            </td>
            <td class="p-4 text-center font-mono font-bold text-base text-white" id="qty-${item.rowIndex}">
              ${item.quantidade}
            </td>
            <td class="p-4 text-center">
              <div class="inline-flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button onclick="updateQty(${item.rowIndex}, -1)" class="w-7 h-7 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-bold transition">-</button>
                <button onclick="updateQty(${item.rowIndex}, 1)" class="w-7 h-7 flex items-center justify-center bg-blue-600 hover:bg-blue-500 text-white rounded font-bold transition">+</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    // Altera a quantidade no Google Sheets (+ / -)
    async function updateQty(rowIndex, delta) {
      const item = rawInventoryData.find(i => i.rowIndex === rowIndex);
      if(!item) return;

      const newQty = Math.max(0, item.quantidade + delta);
      item.quantidade = newQty; // Atualização otimista na UI
      document.getElementById(`qty-${rowIndex}`).innerText = newQty;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'updateQuantity',
            rowIndex: rowIndex,
            quantidade: newQty
          })
        });
      } catch (e) {
        alert("Erro ao sincronizar com o Google Sheets.");
      }
    }

    // Modal Handlers
    function openModal() { document.getElementById('itemModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

    // Cadastra nova peça na planilha
    async function handleAddItem(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Salvando...";

      const newItem = {
        equipamento: document.getElementById('newEquip').value,
        peca: document.getElementById('newPeca').value,
        categoria: document.getElementById('newCat').value,
        prioridade: document.getElementById('newPrio').value,
        funcao: document.getElementById('newFunc').value,
        prevTroca: document.getElementById('newPrev').value,
        quantidade: document.getElementById('newQty').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'addItem',
            item: newItem
          })
        });
        
        alert("Peça adicionada! A atualização pode levar alguns segundos na planilha.");
        closeModal();
        document.getElementById('addForm').reset();
        setTimeout(fetchData, 1500); // Recarrega os dados
      } catch (e) {
        alert("Erro ao adicionar item.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Salvar Peça";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
