<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque & Manutenção - Análises Clínicas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- jsPDF e jsPDF-AutoTable para geração do Relatório PDF A4 Horizontal -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header da Aplicação -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-blue-600 rounded-xl text-white shadow-md">
          <i class="ph ph-first-aid-kit text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">Estoque de Peças de Reposição</h1>
          <p class="text-xs text-slate-400">Laboratório de Análises Clínicas & Engenharia Clínica</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <!-- Botão Exportar PDF -->
        <button onclick="exportToPDF()" class="flex items-center gap-2 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg text-sm text-white transition shadow-md">
          <i class="ph ph-file-pdf text-lg"></i> Exportar PDF
        </button>
        <button onclick="fetchData()" class="flex items-center gap-2 px-3.5 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition">
          <i class="ph ph-arrows-clockwise text-base" id="refresh-icon"></i> Sincronizar
        </button>
        <button onclick="openCreateModal()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-sm transition shadow-md">
          <i class="ph ph-plus-circle text-lg"></i> Nova Peça
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
    
    <!-- Filtros -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="relative">
        <i class="ph ph-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-lg"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Buscar peça, função ou categoria..." 
               class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
      </div>
      <div>
        <select id="equipFilter" onchange="applyFilters()" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
          <option value="">Todos os Equipamentos</option>
        </select>
      </div>
      <div>
        <select id="prioFilter" onchange="applyFilters()" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-200">
          <option value="">Todas as Prioridades</option>
          <option value="Alta">Alta Prioridade</option>
          <option value="Média">Média Prioridade</option>
          <option value="Baixa">Baixa Prioridade</option>
        </select>
      </div>
    </div>

    <!-- Indicador de Carregamento -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
      <i class="ph ph-spinner animate-spin text-4xl text-blue-500 mb-2"></i>
      <p class="text-sm">Carregando estoque da planilha...</p>
    </div>

    <!-- Tabela de Peças -->
    <div id="tableContainer" class="hidden bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 font-semibold border-b border-slate-700">
            <tr>
              <th class="p-4">Equipamento</th>
              <th class="p-4">Peça / Insumo</th>
              <th class="p-4">Categoria</th>
              <th class="p-4 text-center">Prioridade</th>
              <th class="p-4 text-center">Qtd Atual</th>
              <th class="p-4 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="inventoryBody" class="divide-y divide-slate-700/50">
            <!-- Linhas dinâmicas inseridas via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL 1: Entrada / Saída de Estoque -->
  <div id="movementModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 id="movModalTitle" class="text-lg font-bold text-white">Movimentar Estoque</h3>
        <button onclick="closeModal('movementModal')" class="text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form onsubmit="handleStockMovement(event)" class="space-y-4">
        <input type="hidden" id="movRowIndex">
        <input type="hidden" id="movType">
        
        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50">
          <p class="text-xs text-slate-400">Peça selecionada:</p>
          <p id="movPecaName" class="font-bold text-white text-base"></p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Quantidade da Operação</label>
          <input type="number" id="movQty" min="1" value="1" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Técnico Responsável *</label>
          <input type="text" id="movTecnico" required placeholder="Nome do técnico de laboratório/engenheiro" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:border-blue-500">
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
          <button type="button" onclick="closeModal('movementModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">Cancelar</button>
          <button type="submit" id="movSubmitBtn" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-white"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: Incluir ou Editar Peça -->
  <div id="itemFormModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 id="formModalTitle" class="text-lg font-bold text-white">Formulário de Peça</h3>
        <button onclick="closeModal('itemFormModal')" class="text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
      </div>
      <form id="itemForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="formRowIndex">
        <input type="hidden" id="formMode" value="create">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">Equipamento/Modalidade *</label>
            <input type="text" id="formEquip" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Peça / Insumo Crítico *</label>
            <input type="text" id="formPeca" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">Categoria / Tipo</label>
            <input type="text" id="formCat" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Prioridade Estoque</label>
            <select id="formPrio" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
              <option value="Alta">Alta</option>
              <option value="Média">Média</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">Função Principal</label>
          <textarea id="formFunc" rows="2" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">Prevalência / Vida Útil</label>
            <input type="text" id="formPrev" placeholder="Ex: 3 a 6 meses" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
          <div id="initialQtyContainer">
            <label class="block text-xs text-slate-300 mb-1">Qtd Inicial de Estoque</label>
            <input type="number" id="formQty" min="0" value="0" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
          </div>
        </div>

        <div id="tecnicoCadastroContainer">
          <label class="block text-xs text-slate-300 mb-1">Técnico Responsável pelo Cadastro *</label>
          <input type="text" id="formTecnico" placeholder="Nome do responsável" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
          <button type="button" onclick="closeModal('itemFormModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">Cancelar</button>
          <button type="submit" id="formSaveBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lógica JavaScript da Aplicação -->
  <script>
    let API_URL = "";
    let rawInventoryData = [];
    let currentFilteredData = []; // Armazena os dados filtrados atualmente na tela

    async function init() {
      try {
        const configRes = await fetch('/api/config');
        if (configRes.ok) {
          const config = await configRes.json();
          API_URL = config.apiUrl;
        }
      } catch (e) {
        console.warn("Sem endpoint /api/config. Certifique-se de configurar a API_URL.");
      }
      fetchData();
    }

    async function fetchData() {
      if (!API_URL) {
        alert("URL do Google Apps Script não configurada!");
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tableContainer').classList.add('hidden');
      document.getElementById('refresh-icon').classList.add('animate-spin');

      try {
        const res = await fetch(API_URL);
        rawInventoryData = await res.json();
        populateEquipFilter();
        applyFilters();
      } catch (err) {
        alert("Erro ao carregar os dados do Google Sheets.");
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('tableContainer').classList.remove('hidden');
        document.getElementById('refresh-icon').classList.remove('animate-spin');
      }
    }

    function populateEquipFilter() {
      const select = document.getElementById('equipFilter');
      const uniqueEquips = [...new Set(rawInventoryData.map(i => i.equipamento))].filter(Boolean).sort();
      select.innerHTML = '<option value="">Todos os Equipamentos</option>';
      uniqueEquips.forEach(eq => { select.innerHTML += `<option value="${eq}">${eq}</option>`; });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const equip = document.getElementById('equipFilter').value;
      const prio = document.getElementById('prioFilter').value;

      currentFilteredData = rawInventoryData.filter(item => {
        const matchSearch = item.peca.toLowerCase().includes(search) || 
                            item.funcao.toLowerCase().includes(search) || 
                            item.categoria.toLowerCase().includes(search);
        const matchEquip = !equip || item.equipamento === equip;
        const matchPrio = !prio || item.prioridade === prio;
        return matchSearch && matchEquip && matchPrio;
      });

      renderTable(currentFilteredData);
    }

    function renderTable(items) {
      const tbody = document.getElementById('inventoryBody');
      tbody.innerHTML = "";

      if(items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Nenhum item encontrado com os filtros aplicados.</td></tr>`;
        return;
      }

      items.forEach(item => {
        const prioBadge = item.prioridade === 'Alta' 
          ? 'bg-red-500/10 text-red-400 border-red-500/20' 
          : item.prioridade === 'Média' 
          ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' 
          : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-4 font-semibold text-white">${item.equipamento}</td>
            <td class="p-4">
              <div class="font-medium text-slate-200">${item.peca}</div>
              <div class="text-xs text-slate-400">${item.funcao}</div>
            </td>
            <td class="p-4 text-slate-400 text-xs">${item.categoria}</td>
            <td class="p-4 text-center">
              <span class="px-2.5 py-1 text-xs border rounded-full font-medium ${prioBadge}">${item.prioridade}</span>
            </td>
            <td class="p-4 text-center font-mono font-bold text-base text-white" id="qty-${item.rowIndex}">
              ${item.quantidade}
            </td>
            <td class="p-4 text-center">
              <select onchange="handleActionSelect(this, ${item.rowIndex})" class="bg-slate-900 text-xs font-semibold text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer">
                <option value="" selected disabled>Opções ⚙️</option>
                <option value="entrada" class="text-emerald-400 font-bold">➕ Dar Entrada</option>
                <option value="saida" class="text-red-400 font-bold">➖ Dar Baixa (Saída)</option>
                <option value="editar" class="text-blue-400">✏️ Editar Cadastro</option>
              </select>
            </td>
          </tr>
        `;
      });
    }

    // GERAÇÃO DO RELATÓRIO PDF (FORMATO A4 PAISAGEM / HORIZONTAL)
    function exportToPDF() {
      if (!currentFilteredData || currentFilteredData.length === 0) {
        alert("Não há dados visíveis para exportar em PDF.");
        return;
      }

      const { jsPDF } = window.jspdf;
      // Inicializa documento A4 na orientação Paisagem (Landscape)
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

      const today = new Date().toLocaleString('pt-BR');
      const totalItens = currentFilteredData.length;
      const totalUnidades = currentFilteredData.reduce((acc, curr) => acc + (parseInt(curr.quantidade) || 0), 0);
      const altaPrioridade = currentFilteredData.filter(i => i.prioridade === 'Alta').length;

      // 1. Cabeçalho Corporativo
      doc.setFillColor(27, 54, 93); // Azul Marinho Executive (#1B365D)
      doc.rect(0, 0, 297, 24, 'F');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(255, 255, 255);
      doc.text("Relatório de Controle de Estoque - Análises Clínicas", 14, 13);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(200, 215, 235);
      doc.text(`Gerado em: ${today}`, 220, 13);

      // Subtítulo e Filtros Aplicados
      doc.setFontSize(10);
      doc.setTextColor(60, 60, 60);
      
      const searchVal = document.getElementById('searchInput').value || 'Nenhum';
      const equipVal = document.getElementById('equipFilter').value || 'Todos';
      const prioVal = document.getElementById('prioFilter').value || 'Todas';
      doc.text(`Filtros Ativos -> Equipamento: [${equipVal}] | Prioridade: [${prioVal}] | Busca: [${searchVal}]`, 14, 32);

      // 2. Cards com Resumo Executivo das Métricas
      // Card 1: Total de Tipos de Peça
      doc.setFillColor(240, 244, 248);
      doc.roundedRect(14, 36, 85, 18, 2, 2, 'F');
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text("TIPOS DE PEÇAS FILTRADAS", 18, 42);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(27, 54, 93);
      doc.text(`${totalItens} itens`, 18, 50);

      // Card 2: Unidades em Estoque
      doc.setFillColor(240, 244, 248);
      doc.roundedRect(106, 36, 85, 18, 2, 2, 'F');
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(100, 100, 100);
      doc.text("SALDO TOTAL EM ESTOQUE", 110, 42);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(27, 54, 93);
      doc.text(`${totalUnidades} unidades`, 110, 50);

      // Card 3: Peças Críticas (Alta Prioridade)
      doc.setFillColor(254, 242, 242); // Vermelho Claro
      doc.roundedRect(198, 36, 85, 18, 2, 2, 'F');
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(150, 50, 50);
      doc.text("ITENS DE ALTA PRIORIDADE", 202, 42);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(185, 28, 28);
      doc.text(`${altaPrioridade} itens`, 202, 50);

      // 3. Tabela de Registros com AutoTable
      const tableHeaders = [["Equipamento / Setor", "Peça / Insumo Crítico", "Categoria / Tipo", "Função Principal", "Vida Útil", "Prioridade", "Saldo"]];
      
      const tableData = currentFilteredData.map(item => [
        item.equipamento,
        item.peca,
        item.categoria,
        item.funcao,
        item.prevTroca,
        item.prioridade,
        item.quantidade
      ]);

      doc.autoTable({
        startY: 59,
        head: tableHeaders,
        body: tableData,
        theme: 'striped',
        headStyles: {
          fillColor: [44, 62, 80],
          textColor: [255, 255, 255],
          fontStyle: 'bold',
          fontSize: 9,
          halign: 'left'
        },
        bodyStyles: {
          fontSize: 8.5,
          textColor: [40, 40, 40]
        },
        columnStyles: {
          0: { cellWidth: 38 }, // Equipamento
          1: { cellWidth: 50, fontStyle: 'bold' }, // Peça
          2: { cellWidth: 35 }, // Categoria
          3: { cellWidth: 80 }, // Função
          4: { cellWidth: 32 }, // Vida Útil
          5: { cellWidth: 22, halign: 'center' }, // Prioridade
          6: { cellWidth: 12, halign: 'center', fontStyle: 'bold' }  // Saldo
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252]
        },
        didParseCell: function(data) {
          // Destaque para a coluna de prioridade
          if (data.section === 'body' && data.column.index === 5) {
            if (data.cell.raw === 'Alta') {
              data.cell.styles.textColor = [185, 28, 28];
              data.cell.styles.fontStyle = 'bold';
            }
          }
        },
        margin: { left: 14, right: 14 },
        didDrawPage: function(data) {
          // Rodapé em todas as páginas com numeração
          const str = `Página ${doc.internal.getNumberOfPages()}`;
          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text(str, 283, 203, { align: 'right' });
          doc.text("Sistema de Gestão de Estoque - Hospitalar & Laboratorial", 14, 203);
        }
      });

      // Baixa o arquivo PDF no computador
      doc.save(`Relatorio_Estoque_Pecas_${new Date().toISOString().slice(0,10)}.pdf`);
    }

    // Ações de Entrada / Saída
    function handleActionSelect(selectElement, rowIndex) {
      const action = selectElement.value;
      selectElement.value = "";

      if (action === "entrada") openMovementModal(rowIndex, "Entrada");
      else if (action === "saida") openMovementModal(rowIndex, "Saída");
      else if (action === "editar") openEditModal(rowIndex);
    }

    function openMovementModal(rowIndex, tipo) {
      const item = rawInventoryData.find(i => i.rowIndex === rowIndex);
      if(!item) return;

      document.getElementById('movRowIndex').value = rowIndex;
      document.getElementById('movType').value = tipo;
      document.getElementById('movPecaName').innerText = `${item.peca} (${item.equipamento})`;
      
      const submitBtn = document.getElementById('movSubmitBtn');
      if (tipo === "Entrada") {
        document.getElementById('movModalTitle').innerText = "Dar Entrada no Estoque";
        submitBtn.innerText = "Registrar Entrada";
        submitBtn.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white";
      } else {
        document.getElementById('movModalTitle').innerText = "Dar Baixa no Estoque (Saída)";
        submitBtn.innerText = "Registrar Baixa";
        submitBtn.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-red-600 hover:bg-red-500 text-white";
      }

      openModal('movementModal');
    }

    async function handleStockMovement(e) {
      e.preventDefault();
      const rowIndex = parseInt(document.getElementById('movRowIndex').value);
      const tipo = document.getElementById('movType').value;
      const qtyInput = parseInt(document.getElementById('movQty').value);
      const tecnico = document.getElementById('movTecnico').value;

      const delta = tipo === "Entrada" ? qtyInput : -qtyInput;

      closeModal('movementModal');

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'stockMovement',
            rowIndex: rowIndex,
            quantidade: delta,
            tipo: tipo,
            tecnico: tecnico
          })
        });

        alert(`Operação de ${tipo} salva com sucesso!`);
        setTimeout(fetchData, 1200);
      } catch (err) {
        alert("Erro ao salvar operação.");
      }
    }

    function openCreateModal() {
      document.getElementById('formModalTitle').innerText = "Cadastrar Nova Peça";
      document.getElementById('formMode').value = "create";
      document.getElementById('itemForm').reset();
      document.getElementById('initialQtyContainer').classList.remove('hidden');
      document.getElementById('tecnicoCadastroContainer').classList.remove('hidden');
      openModal('itemFormModal');
    }

    function openEditModal(rowIndex) {
      const item = rawInventoryData.find(i => i.rowIndex === rowIndex);
      if(!item) return;

      document.getElementById('formModalTitle').innerText = "Editar Peça";
      document.getElementById('formMode').value = "edit";
      document.getElementById('formRowIndex').value = rowIndex;

      document.getElementById('formEquip').value = item.equipamento;
      document.getElementById('formPeca').value = item.peca;
      document.getElementById('formCat').value = item.categoria;
      document.getElementById('formPrio').value = item.prioridade;
      document.getElementById('formFunc').value = item.funcao;
      document.getElementById('formPrev').value = item.prevTroca;

      document.getElementById('initialQtyContainer').classList.add('hidden');
      document.getElementById('tecnicoCadastroContainer').classList.add('hidden');

      openModal('itemFormModal');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const mode = document.getElementById('formMode').value;
      const btn = document.getElementById('formSaveBtn');
      btn.disabled = true;

      const itemPayload = {
        equipamento: document.getElementById('formEquip').value,
        peca: document.getElementById('formPeca').value,
        categoria: document.getElementById('formCat').value,
        prioridade: document.getElementById('formPrio').value,
        funcao: document.getElementById('formFunc').value,
        prevTroca: document.getElementById('formPrev').value,
        quantidade: document.getElementById('formQty').value,
        tecnico: document.getElementById('formTecnico').value
      };

      const payload = {
        action: mode === "create" ? "addItem" : "editItem",
        rowIndex: parseInt(document.getElementById('formRowIndex').value) || null,
        item: itemPayload
      };

      closeModal('itemFormModal');

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("Registro salvo com sucesso!");
        setTimeout(fetchData, 1200);
      } catch(err) {
        alert("Erro ao salvar.");
      } finally {
        btn.disabled = false;
      }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    window.onload = init;
  </script>
</body>
</html>
